name: Deno Deploy

on:
  push:
    branches-ignore:
      - dist/**
    tags-ignore:
      - "**"
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ubiquity/deno-deploy-workflow/.github/workflows/deno-deploy-reusable.yml@codex/deno-2-programmatic
    with:
      project: pay-ubq-fi
      deploy_platform: deno2
      entrypoint: serve.ts
      install_command: deno install
      build_command: deno task build
      build_env: |
        VITE_SUPABASE_URL=$SUPABASE_URL
        VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      runtime_env: |
        STATIC_DIR=dist
        SUPABASE_URL=$SUPABASE_URL
        SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
      include: |
        dist/**
      extra_paths: |
        /smoke/path
      debug_fetch_fail: true
      required_env: |
        DENO_DEPLOY_TOKEN
        SUPABASE_URL
        SUPABASE_SERVICE_ROLE_KEY
        SUPABASE_ANON_KEY
    secrets: inherit
